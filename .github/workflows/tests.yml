name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests (fast, no Docker)
        run: pytest -m "not db" -q

      # testcontainers uses the Docker daemon available on ubuntu runners.
      - name: Database tests (testcontainers → postgres:18)
        run: pytest -m db -q
