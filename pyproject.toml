# One style for the whole project: `ruff format .` then `ruff check --fix .`
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "F",    # pyflakes: unused imports and names
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import order
    "UP",   # modern Python syntax
    "D",    # docstrings
    "ANN",  # type hints on function signatures
    "C90",  # one function does one thing: limited branching
    "SIM",  # the simpler form of an if, a with or a loop
    "RET",  # no detour before a return
    "C4",   # plain comprehensions
    "PIE",  # no needless statements
    "PERF", # no slow loops where a plain form exists
    "PLR0913", # at most 6 arguments
]
ignore = [
    "D203", "D213",          # one docstring layout: summary on the first line
    "D100", "D104",          # package __init__ files carry no docstring
    "ANN401",                # Any is allowed where pandas or psycopg2 values pass through
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PLR0913"]  # test row builders take one argument per column

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["fec"]
