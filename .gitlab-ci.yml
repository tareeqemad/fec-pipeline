# GitLab test pipeline.
stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PG_USER: test
  PG_PASSWORD: test

cache:
  key: pip
  paths:
    - .cache/pip

# ── Fast layer: unit tests (no Docker) ──────────────────────────────
unit-tests:
  stage: test
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt
  script:
    - pytest -m "not db" -q

# ── DB layer: schema.sql on a Postgres SERVICE (no Docker-in-Docker) ──
# Uses GitLab's native `postgres` service container, so it needs no privileged
# runner. The conftest reads TEST_DATABASE_URL and applies schema.sql to it.
db-tests:
  stage: test
  image: python:3.12
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_DB: test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    TEST_DATABASE_URL: "postgresql://test:test@postgres:5432/test"
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt
  script:
    - pytest -m db -q
